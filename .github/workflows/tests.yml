name: tests
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '12.*' }
          - { php: '8.4', laravel: '12.*' }
          - { php: '8.5', laravel: '12.*' }
          - { php: '8.3', laravel: '13.*' }
          - { php: '8.4', laravel: '13.*' }
          - { php: '8.5', laravel: '13.*' }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl, sockets
          coverage: none
      - run: composer require --dev "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/pint --test

  minimal:
    # Only the required dependencies: proves the package boots and its tests pass (or skip) when
    # neither laravel/reverb nor laravel/doctor (and so no Pusher client) is installed. No phpstan
    # here, because the optional classes are missing.
    runs-on: ubuntu-latest
    name: PHP 8.3 / Laravel 12.* / no optional packages
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - run: composer remove --dev laravel/reverb laravel/doctor --no-update --no-interaction
      - run: composer require --dev "illuminate/support:12.*" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
